name: ACEP Production Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release gates
        run: npm run ci:gate
      - name: Deployment policy
        run: echo 'DEPLOYMENT_POLICY=MANUAL_APPROVAL_REQUIRED_NO_AUTO_DEPLOY'
